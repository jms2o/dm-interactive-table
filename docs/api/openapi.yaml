openapi: 3.1.0
info:
  title: DM Interactive Table API
  version: 2.0.0-alpha.20
  description: API HTTP inicial para campañas, escenas, mapas, combate, dados e IA.
servers:
  - url: http://localhost:4000/api
paths:
  /health:
    get:
      summary: Health check del servidor
      operationId: getHealth
      responses:
        "200":
          description: Servidor disponible
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
                  persistence:
                    type: string
                    enum: [memory, prisma]
                    example: memory
  /demo/readiness:
    get:
      summary: Obtener estado de preparación de demo
      operationId: getDemoReadiness
      responses:
        "200":
          description: Checklist de demo 1.0.0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoReadiness"
  /rulesets:
    get:
      summary: Listar rulesets disponibles
      operationId: listRulesets
      responses:
        "200":
          description: Catálogo de rulesets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RulesetSummary"
  /rulesets/{rulesetId}:
    get:
      summary: Obtener definición de ruleset
      operationId: getRuleset
      parameters:
        - name: rulesetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Definición completa del ruleset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RulesetDefinition"
        "404":
          description: Ruleset no encontrado
  /worlds:
    get:
      summary: Listar mundos
      operationId: listWorlds
      responses:
        "200":
          description: Lista de mundos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/World"
    post:
      summary: Crear mundo
      operationId: createWorld
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorldRequest"
      responses:
        "201":
          description: Mundo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/World"
  /campaigns:
    get:
      summary: Listar campañas
      operationId: listCampaigns
      responses:
        "200":
          description: Lista de campañas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      summary: Crear campaña
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "201":
          description: Campaña creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/{campaignId}/scenes:
    get:
      summary: Listar escenas de campaña
      operationId: listScenes
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de escenas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
    post:
      summary: Crear escena
      operationId: createScene
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSceneRequest"
      responses:
        "201":
          description: Escena creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /campaigns/{campaignId}/sessions:
    get:
      summary: Listar sesiones de campaña
      operationId: listCampaignSessions
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de sesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSession"
    post:
      summary: Crear sesión
      operationId: createCampaignSession
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameSessionRequest"
      responses:
        "201":
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /campaigns/{campaignId}/ruleset:
    get:
      summary: Obtener ruleset activo de campaña
      operationId: getCampaignRuleset
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Ruleset resuelto para la campaña
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignRulesetResponse"
  /campaigns/{campaignId}/package/export:
    get:
      summary: Exportar campaña como paquete portable
      operationId: exportCampaignPackage
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Paquete de campaña exportado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPackage"
        "404":
          description: Campaña no encontrada
  /campaign-packages/import:
    post:
      summary: Validar paquete de campaña importado
      operationId: importCampaignPackage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignPackageImportRequest"
      responses:
        "200":
          description: Paquete importable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPackageImportReport"
        "422":
          description: Paquete no importable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPackageImportReport"
  /campaigns/{campaignId}/assets:
    get:
      summary: Listar assets de campaña
      operationId: listCampaignAssets
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssetLibraryType"
      responses:
        "200":
          description: Biblioteca de assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryResponse"
    post:
      summary: Registrar asset de campaña
      operationId: createCampaignAsset
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Asset registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryItem"
  /campaigns/{campaignId}/assets/{assetId}:
    get:
      summary: Consultar asset de campaña
      operationId: getCampaignAsset
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetLibraryItem"
        "404":
          description: Asset no encontrado
  /campaigns/{campaignId}/maps:
    get:
      summary: Listar mapas
      operationId: listMaps
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de mapas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleMap"
  /campaigns/{campaignId}/encounters:
    post:
      summary: Crear encuentro
      operationId: createEncounter
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEncounterRequest"
      responses:
        "201":
          description: Encuentro creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
  /campaigns/{campaignId}/encounters/active:
    get:
      summary: Obtener encuentro activo por escena
      operationId: getActiveEncounter
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: sceneId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Encuentro activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
        "404":
          description: No hay encuentro activo
  /campaigns/{campaignId}/encounters/{encounterId}/turn/advance:
    post:
      summary: Avanzar turno del encuentro
      operationId: advanceEncounterTurn
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: encounterId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Encuentro actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Encounter"
  /campaigns/{campaignId}/dice/roll:
    post:
      summary: Ejecutar tirada
      operationId: rollDice
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RollDiceRequest"
      responses:
        "200":
          description: Resultado de tirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiceRoll"
  /campaigns/{campaignId}/npcs:
    get:
      summary: Listar NPCs
      operationId: listNpcs
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de NPCs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NPC"
    post:
      summary: Crear NPC
      operationId: createNpc
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNPCRequest"
      responses:
        "201":
          description: NPC creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NPC"
  /campaigns/{campaignId}/npcs/{npcId}/token:
    post:
      summary: Convertir NPC en token
      operationId: createNpcToken
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: npcId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityTokenRequest"
      responses:
        "201":
          description: Token creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameToken"
  /campaigns/{campaignId}/enemies:
    get:
      summary: Listar enemigos
      operationId: listEnemies
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de enemigos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enemy"
    post:
      summary: Crear enemigo
      operationId: createEnemy
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnemyRequest"
      responses:
        "201":
          description: Enemigo creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enemy"
  /campaigns/{campaignId}/enemies/{enemyId}/token:
    post:
      summary: Convertir enemigo en token
      operationId: createEnemyToken
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: enemyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEntityTokenRequest"
      responses:
        "201":
          description: Token creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameToken"
  /campaigns/{campaignId}/ai/generate:
    post:
      summary: Generar borrador asistido por IA
      operationId: generateWithAi
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Borrador generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiGenerateResponse"
  /campaigns/{campaignId}/ai/runs:
    get:
      summary: Listar ejecuciones de IA
      operationId: listAiPromptRuns
      parameters:
        - $ref: "#/components/parameters/CampaignId"
      responses:
        "200":
          description: Lista de ejecuciones registradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiPromptRun"
  /campaigns/{campaignId}/ai/runs/{promptRunId}/approve:
    post:
      summary: Aprobar o rechazar borrador de IA
      operationId: approveAiPromptRun
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - name: promptRunId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiApproveRequest"
      responses:
        "200":
          description: Estado de revisión actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiApproveResponse"
components:
  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
  schemas:
    World:
      type: object
      required: [id, name, description, systemTags]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        systemTags:
          type: array
          items:
            type: string
    CreateWorldRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        systemTags:
          type: array
          items:
            type: string
    Campaign:
      type: object
      required: [id, name, ruleset, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        ruleset:
          type: string
          example: dnd5e
        status:
          type: string
          enum: [draft, active, archived]
    CreateCampaignRequest:
      type: object
      required: [name, ruleset]
      properties:
        name:
          type: string
        description:
          type: string
        ruleset:
          type: string
        worldId:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
    GameSession:
      type: object
      required: [id, campaignId, title, summaryPublic, summaryPrivate]
      properties:
        id:
          type: string
        campaignId:
          type: string
        title:
          type: string
        scheduledAt:
          type: string
        summaryPublic:
          type: string
        summaryPrivate:
          type: string
    CreateGameSessionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        scheduledAt:
          type: string
    DemoReadiness:
      type: object
      required:
        - version
        - releaseName
        - allReady
        - readyCount
        - totalCount
        - items
        - routes
        - commands
        - updatedAt
      properties:
        version:
          type: string
          example: 1.0.0
        releaseName:
          type: string
        allReady:
          type: boolean
        readyCount:
          type: integer
        totalCount:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/DemoReadinessItem"
        routes:
          type: array
          items:
            $ref: "#/components/schemas/DemoRoute"
        commands:
          type: array
          items:
            type: string
        updatedAt:
          type: string
          format: date-time
    DemoReadinessItem:
      type: object
      required: [id, label, status, evidence]
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum: [ready, warning, blocked]
        evidence:
          type: string
    DemoRoute:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
        url:
          type: string
    CampaignPackage:
      type: object
      required:
        - kind
        - schemaVersion
        - packageId
        - appVersion
        - exportedAt
        - manifest
        - data
      properties:
        kind:
          type: string
          const: dm-interactive-table.campaign-package
        schemaVersion:
          type: integer
          const: 1
        packageId:
          type: string
        appVersion:
          type: string
          example: 2.0.0-alpha.20
        exportedAt:
          type: string
          format: date-time
        manifest:
          $ref: "#/components/schemas/CampaignPackageManifest"
        data:
          $ref: "#/components/schemas/CampaignPackageData"
    CampaignPackageManifest:
      type: object
      required:
        - campaignId
        - campaignName
        - rulesetId
        - exportedBy
        - contentProfile
        - assetMode
        - counts
      properties:
        campaignId:
          type: string
        campaignName:
          type: string
        rulesetId:
          type: string
        exportedBy:
          type: string
        contentProfile:
          type: string
          enum: [dm-private]
        assetMode:
          type: string
          enum: [metadata-only]
        counts:
          $ref: "#/components/schemas/CampaignPackageCounts"
    CampaignPackageCounts:
      type: object
      required:
        - worlds
        - campaigns
        - sessions
        - scenes
        - tokens
        - npcs
        - enemies
        - promptRuns
        - assets
        - audioPresets
        - audioCues
      properties:
        worlds:
          type: integer
        campaigns:
          type: integer
        sessions:
          type: integer
        scenes:
          type: integer
        tokens:
          type: integer
        npcs:
          type: integer
        enemies:
          type: integer
        promptRuns:
          type: integer
        assets:
          type: integer
        audioPresets:
          type: integer
        audioCues:
          type: integer
    CampaignPackageData:
      type: object
      required:
        - worlds
        - campaigns
        - sessions
        - activeScene
        - npcs
        - enemies
        - promptRuns
        - rulesets
        - assets
        - audioScenes
      properties:
        worlds:
          type: array
          items:
            $ref: "#/components/schemas/World"
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/GameSession"
        activeScene:
          type: object
          additionalProperties: true
        npcs:
          type: array
          items:
            $ref: "#/components/schemas/NPC"
        enemies:
          type: array
          items:
            $ref: "#/components/schemas/Enemy"
        promptRuns:
          type: array
          items:
            $ref: "#/components/schemas/AiPromptRun"
        rulesets:
          type: array
          items:
            $ref: "#/components/schemas/RulesetSummary"
        assets:
          type: array
          items:
            $ref: "#/components/schemas/CampaignPackageAsset"
        audioScenes:
          type: array
          items:
            $ref: "#/components/schemas/CampaignPackageAudioScene"
    CampaignPackageAudioScene:
      type: object
      required: [sceneId, sceneName, presetCount, cueCount, presetIds, assetIds]
      properties:
        sceneId:
          type: string
        sceneName:
          type: string
        presetCount:
          type: integer
        cueCount:
          type: integer
        presetIds:
          type: array
          items:
            type: string
        assetIds:
          type: array
          items:
            type: string
        transitionMode:
          type: string
          enum: [cut, fade, crossfade]
    CampaignPackageAsset:
      type: object
      required: [id, type, usage, name, source, referencedBy]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [map, token, token-swatch, music, sound, effect, portrait]
        usage:
          type: string
          enum: [scene-map, token, ambience, effect, portrait]
        name:
          type: string
        url:
          type: string
        inlineValue:
          type: string
        source:
          type: string
          enum: [asset-storage, local-url, generated, metadata]
        storageAssetId:
          type: string
        referencedBy:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
    CampaignPackageImportRequest:
      type: object
      required: [package]
      properties:
        version:
          type: integer
          const: 1
        mode:
          type: string
          enum: [validate, preview, apply-copy]
        package:
          $ref: "#/components/schemas/CampaignPackage"
        requestId:
          type: string
    CampaignPackageImportReport:
      type: object
      required: [ok, requestId, mode, importable, applied, issues, checkedAt]
      properties:
        ok:
          type: boolean
        requestId:
          type: string
        mode:
          type: string
          enum: [validate, preview, apply-copy]
        importable:
          type: boolean
        applied:
          type: boolean
        packageId:
          type: string
        campaignId:
          type: string
        campaignName:
          type: string
        schemaVersion:
          type: integer
        counts:
          $ref: "#/components/schemas/CampaignPackageCounts"
        appliedResources:
          $ref: "#/components/schemas/CampaignPackageAppliedResources"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/CampaignPackageImportIssue"
        checkedAt:
          type: string
          format: date-time
    CampaignPackageAppliedResources:
      type: object
      required: [sessionIds, npcIds, enemyIds, promptRunIds, assetIds]
      properties:
        worldId:
          type: string
        campaignId:
          type: string
        sessionIds:
          type: array
          items:
            type: string
        sceneId:
          type: string
        npcIds:
          type: array
          items:
            type: string
        enemyIds:
          type: array
          items:
            type: string
        promptRunIds:
          type: array
          items:
            type: string
        assetIds:
          type: array
          items:
            type: string
    AssetLibraryType:
      type: string
      enum: [map, token, portrait, music, sound, effect]
    AssetProvider:
      type: string
      enum: [local, remote, generated]
    AssetStatus:
      type: string
      enum: [available, missing, archived]
    AssetLibraryResponse:
      type: object
      required: [version, campaignId, assets, counts, updatedAt]
      properties:
        version:
          type: integer
          const: 1
        campaignId:
          type: string
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetLibraryItem"
        counts:
          $ref: "#/components/schemas/AssetLibraryCounts"
        updatedAt:
          type: string
          format: date-time
    AssetLibraryCounts:
      type: object
      required: [map, token, portrait, music, sound, effect]
      properties:
        map:
          type: integer
        token:
          type: integer
        portrait:
          type: integer
        music:
          type: integer
        sound:
          type: integer
        effect:
          type: integer
    AssetLibraryItem:
      type: object
      required:
        - id
        - campaignId
        - type
        - name
        - url
        - provider
        - status
        - metadata
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        campaignId:
          type: string
        type:
          $ref: "#/components/schemas/AssetLibraryType"
        name:
          type: string
        url:
          type: string
        provider:
          $ref: "#/components/schemas/AssetProvider"
        status:
          $ref: "#/components/schemas/AssetStatus"
        metadata:
          type: object
          additionalProperties: true
