services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dm_interactive_table
      POSTGRES_USER: dm_table
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-table-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_table -d dm_interactive_table"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_ORIGIN: "*"
      DATABASE_URL: postgresql://dm_table:${POSTGRES_PASSWORD:-local-table-password}@database:5432/dm_interactive_table?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-auth-secret-change-before-exposing-the-table}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      TABLE_CODE_TTL_MINUTES: ${TABLE_CODE_TTL_MINUTES:-720}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ./assets:/app/assets
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
