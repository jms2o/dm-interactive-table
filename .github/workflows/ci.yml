name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dm_interactive_table_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dm_interactive_table_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      CLIENT_ORIGIN: "*"
      AUTH_SECRET: ci-auth-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dm_interactive_table_test?schema=public
      DATA_DIR: /tmp/dm-interactive-table
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm run prisma:deploy --prefix server
      - run: npm run build
      - run: npm run lint --prefix client
      - run: npm run docs:validate
      - run: npm run test:vision
      - run: npm run test:camera
      - run: npm run test:layers
      - run: npm run test:security
      - run: npm run test:recovery
      - run: npm run test:smoke
      - run: npm audit --audit-level=high
      - run: npm audit --prefix client --audit-level=high
      - run: npm audit --prefix server --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
