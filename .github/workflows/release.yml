name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dm_interactive_table_release
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dm_interactive_table_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      CLIENT_ORIGIN: "*"
      AUTH_SECRET: release-secret-with-at-least-32-characters
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dm_interactive_table_release?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dm_interactive_table_release?schema=public
      DATA_DIR: /tmp/dm-interactive-table-release
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run prisma:deploy --workspace server
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi

          release_args=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "DM Interactive Table $GITHUB_REF_NAME"
            --generate-notes
          )

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"
